version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev:
        dependency-type: development
    ignore:
      # @types/node tracks the Node major Derive runs on (engines.node >=22.5); bump it with the runtime, not on its own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
