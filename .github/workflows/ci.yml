name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        # The version comes from packageManager in package.json.

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The method is written once under method/ and rendered into the app's
      # system prompt, the plugin skill, both Codex skills and the plugin
      # commands' allowed-tools. Every copy is committed, and this fails rather
      # than regenerating: a change to what a model is told must be seen in the
      # diff of the pull request that makes it.
      - name: Method text has not drifted
        run: pnpm method:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # The tests drive the built server over HTTP with no model behind it:
      # the learning mechanics (warm-up, the understanding gate, the
      # cumulative quiz, implicit repetition) are all server-side.
      - name: Test
        run: pnpm test
        env:
          CI: 'true'

      # tsc covers server/src and web/src only, so the standalone .mjs files —
      # the method renderer and its CI gate, the preflight doctor, and the
      # Claude Code hook that ships in the plugin — have no other check.
      # `pnpm check` runs doctor.mjs for real on a developer's machine; here it
      # would only ever report a missing Claude login, so parse them instead.
      - name: Standalone scripts parse
        run: |
          for f in scripts/render-method.mjs scripts/check-method.mjs scripts/doctor.mjs plugin/hooks/mirror.mjs; do
            node --check "$f"
          done
