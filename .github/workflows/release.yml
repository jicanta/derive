name: Release

# Tag a commit `vX.Y.Z` and this builds Derive, packs the Claude Code plugin
# with the built MCP server, and attaches both to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Pack
        run: |
          mkdir -p out
          tar -czf "out/derive-${GITHUB_REF_NAME}.tar.gz" \
            --exclude=node_modules --exclude=.git --exclude=out \
            package.json pnpm-lock.yaml pnpm-workspace.yaml README.md LICENSE .env.example scripts \
            server/package.json server/dist server/tsconfig.json \
            web/package.json web/dist plugin codex docs
          tar -czf "out/derive-plugin-${GITHUB_REF_NAME}.tar.gz" plugin server/dist server/package.json
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: out/*.tar.gz
